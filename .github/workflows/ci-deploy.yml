name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_ed25519 "$USER@$HOST" deploy

  # Post-deploy checks against the live site. Fails the run only on real regressions (broken/missing share
  # cards or tags, horizontal overflow at 390/1440, console errors); network blips are retried.
  post-deploy-audit:
    needs: deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SITE: https://rupturereport.com
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Wait for the new build to serve
        run: |
          for i in $(seq 1 24); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' -A 'Mozilla/5.0 RR-audit' "$SITE/")" = 200 ] && break; sleep 5
          done
          sleep 10
      - name: Link previews (OG / Twitter cards)
        run: node scripts/audit/og-check.mjs
      # Uses the runner's preinstalled Google Chrome, so no apt downloads (Ubuntu mirrors have flaked on runners).
      - name: Install Playwright library (CI only, not a project dependency)
        timeout-minutes: 3
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i --no-audit --no-fund playwright@1
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          [ -n "$CHROME" ] || { echo "FAIL: no preinstalled Chrome on runner" >&2; exit 1; }
          echo "PW_CHROMIUM=$CHROME" >> "$GITHUB_ENV"; "$CHROME" --version
      - name: Overflow + status + console errors (390 / 1440)
        timeout-minutes: 8
        run: NODE_PATH=/tmp/pw/node_modules node scripts/audit/overflow-check.mjs
